[project]
name = "air-compressor-maintenance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Transitive dep of mlflow/databricks-sdk, pinned above a known-vulnerable
    # version so `uvx pip-audit` in CI passes -- not used directly here.
    "aiohttp>=3.14.3",
    "fastapi>=0.136.1",
    "gitpython>=3.1.58",
    # Capped below 3.13: mlflow>=3.14 hard-disables the file-based tracking
    # backend ("./mlruns", this project's local dev default) by default,
    # which breaks both the local zero-config workflow and the isolated
    # test fixture (tests/conftest.py). Migrating the default to a database
    # backend is real, deliberate future work, not part of this hardening
    # pass. This also transitively blocks patching starlette (mlflow-skinny
    # pins starlette<1) and cryptography (mlflow pins <47) -- see the
    # pip-audit --ignore-vuln list in .github/workflows/ci.yml for the CVEs
    # this defers, all tracked back to this one root cause.
    "mlflow>=3.12.0,<3.13.0",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    # Transitive deps of mlflow (via matplotlib, databricks-sdk) pinned above
    # known-vulnerable versions -- not used directly by this project, but
    # `uvx pip-audit` in CI fails the build otherwise.
    "pillow>=12.3.0",
    "pyasn1>=0.6.4",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.8.0",
    "sqlparse>=0.6.0",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    # Transitive dep of ipykernel/jupyter-client, pinned above a
    # known-vulnerable version for the same reason as pillow/pyasn1 above.
    "tornado>=6.5.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src --cov=api --cov-report=term-missing --cov-fail-under=70"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["notebooks", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src", "api"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
